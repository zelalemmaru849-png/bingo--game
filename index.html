<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Bingo Master Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --dauber-color: #ec4899;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .hidden { display: none !important; }

        /* Auth Styles */
        .auth-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-top: 80px;
        }

        .auth-container h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        input {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .switch-text span {
            color: #38bdf8;
            cursor: pointer;
            font-weight: bold;
        }

        /* Game Header Navigation */
        .user-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .wallet-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        /* Control Panel */
        .control-panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }

        select, button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        select {
            background: #334155;
            color: #fff;
            outline: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }

        .btn-danger {
            background-color: #ef4444;
            color: white;
            font-weight: bold;
        }
        .btn-danger:hover { background-color: #dc2626; }

        .btn-success {
            background-color: var(--success);
            color: white;
            font-weight: bold;
        }
        .btn-success:hover { background-color: #059669; }

        /* 3-Column Layout */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 260px 1fr 320px;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 1100px) { 
            .dashboard-layout { grid-template-columns: 1fr; } 
        }

        /* Left Sidebar: 1-100 Card Selector (Compact) */
        .sidebar-left {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-left h4 {
            color: #38bdf8;
            font-size: 1rem;
            text-align: center;
        }

        .cards-list-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            overflow-y: auto;
            max-height: 520px;
            padding-right: 4px;
        }

        .card-btn {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .card-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .card-btn.selected {
            background: var(--accent);
            color: #78350f;
            border-color: #fbbf24;
        }

        /* Center: Bingo Cards Display Area */
        .center-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cards-area {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-height: 750px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .bingo-card {
            background: #ffffff;
            color: #1e293b;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-top: 4px solid var(--primary);
        }

        .bingo-card h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #0f172a;
            font-size: 1.1rem;
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .bingo-cell {
            aspect-ratio: 1;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
            transition: 0.15s;
        }

        .bingo-cell:hover:not(.header-cell) {
            background: #e2e8f0;
        }

        .bingo-cell.header-cell {
            background: #0f172a;
            color: #fff;
            font-size: 0.9rem;
            cursor: default;
        }

        .bingo-cell.marked {
            background-color: var(--dauber-color);
            color: white;
            border-color: #db2777;
        }

        .bingo-cell.free-space {
            background-color: var(--accent);
            color: #78350f;
            font-size: 0.65rem;
        }

        /* Right Sidebar: Caller Section */
        .caller-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: sticky;
            top: 20px;
        }

        .caller-section h3 { color: #38bdf8; }

        .current-ball {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #f43f5e, #881337);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4), inset 0 5px 15px rgba(255,255,255,0.3);
            animation: bounceIn 0.4s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .current-ball .letter { font-size: 1.3rem; font-weight: bold; color: #ffe4e6; }
        .current-ball .number { font-size: 2.5rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <!-- 1. AUTHENTICATION SECTION -->
    <div id="authSection" class="auth-container">
        <!-- Register -->
        <div id="registerForm">
            <h2>Habesha Bingo 🇪🇹</h2>
            <div class="form-group">
                <label>ሙሉ ስም</label>
                <input type="text" id="regName" placeholder="አበበ በቀለ">
            </div>
            <div class="form-group">
                <label>ስልክ/ኢሜይል</label>
                <input type="text" id="regEmail" placeholder="0911223344">
            </div>
            <div class="form-group">
                <label>ሚስጥር ቁጥር</label>
                <input type="password" id="regPass" placeholder="******">
            </div>
            <button class="btn-primary" style="width:100%" onclick="registerUser()">ተመዝገብ</button>
            <div class="switch-text">አካውንት አለዎት? <span onclick="toggleAuthForms()">ግባ (Login)</span></div>
        </div>

        <!-- Login -->
        <div id="loginForm" class="hidden">
            <h2>Habesha Bingo 🇪🇹</h2>
            <div class="form-group">
                <label>ስልክ/ኢሜይል</label>
                <input type="text" id="loginEmail" placeholder="0911223344">
            </div>
            <div class="form-group">
                <label>ሚስጥር ቁጥር</label>
                <input type="password" id="loginPass" placeholder="******">
            </div>
            <button class="btn-primary" style="width:100%" onclick="loginUser()">ይግቡ</button>
            <div class="switch-text">አካውንት የለዎትም? <span onclick="toggleAuthForms()">ተመዝገብ (Register)</span></div>
        </div>
    </div>

    <!-- 2. MAIN BINGO GAME SECTION -->
    <div id="gameSection" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="user-nav">
            <div>👤 ተጫዋች፦ <strong id="userNameDisplay">--</strong></div>
            <div class="wallet-badge">💰 ቀሪ ባላንስ፦ <span id="userBalance">1000</span> ብር</div>
            <button class="btn-danger" onclick="logoutUser()">ውጣ (Logout)</button>
        </div>

        <div class="game-container">
            <div class="control-panel">
                <div>
                    <label>የማሸነፊያ ህግ፦</label>
                    <select id="patternSelect">
                        <option value="line">መደበኛ መስመር (Line)</option>
                        <option value="corners">4 ማዕዘናት (Corners)</option>
                    </select>
                </div>
                <div>
                    <span id="selectedCardsInfo" style="color: #fbbf24; font-weight: bold;">የተመረጡ ካርዶች: 0 (0 ብር)</span>
                </div>
                <button class="btn-primary" onclick="startSelectedGame()">ካርዶቹን አውጣ</button>
            </div>

            <!-- 3-Column Layout -->
            <div class="dashboard-layout">
                <!-- Left Sidebar: 1-100 Card Selection Buttons -->
                <div class="sidebar-left">
                    <h4>የካርድ ቁጥር (1-100)</h4>
                    <div style="font-size: 0.75rem; color: #94a3b8; text-align: center;">1 ካርድ = 10 ብር</div>
                    <div class="cards-list-grid" id="cardsListGrid"></div>
                </div>

                <!-- Center Area: Selected Bingo Cards -->
                <div class="center-area">
                    <div class="cards-area" id="cardsArea">
                        <div style="text-align: center; color: #94a3b8; grid-column: 1/-1; padding: 40px;">
                            እባክዎ በግራ በኩል ካሉት (1-100) ቁጥሮች የሚፈልጉትን ካርድ ይምረጡና "ካርዶቹን አውጣ" የሚለውን ይጫኑ።
                        </div>
                    </div>
                </div>

                <!-- Right Sidebar: Caller Section (Auto Call) -->
                <div class="caller-section">
                    <h3>የወጣ ቁጥር</h3>
                    <div class="current-ball" id="currentBall">
                        <span class="letter">-</span>
                        <span class="number">--</span>
                    </div>
                    <button class="btn-primary" style="width:100%" onclick="callNextNumber()">በእጅ ጥራ (Manual)</button>
                    <button class="btn-success" id="autoPlayBtn" style="width:100%" onclick="toggleAutoPlay()">▶ አውቶ ጀምር (Auto)</button>
                    <button class="btn-primary" style="width:100%; background-color:#f59e0b; color:#0f172a;" onclick="checkBingo()">BINGO! አውጅ</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let availableNumbers = [], calledNumbers = [], cardsData = [];
        let selectedCards = [];
        let autoPlayInterval = null; // ለአውቶማቲክ ጥሪ ማስተካከያ

        function toggleAuthForms() {
            document.getElementById('registerForm').classList.toggle('hidden');
            document.getElementById('loginForm').classList.toggle('hidden');
        }

        function registerUser() {
            let name = document.getElementById('regName').value.trim();
            let email = document.getElementById('regEmail').value.trim();
            let pass = document.getElementById('regPass').value.trim();

            if(!name || !email || !pass) {
                alert("እባክዎ ሁሉንም መስኮች በትክክል ይሙሉ!");
                return;
            }

            currentUser = { name: name, email: email, pass: pass, balance: 1000 };
            localStorage.setItem('bingoUser', JSON.stringify(currentUser));
            
            alert("ምዝገባው ተሳክቷል! አሁን መግባት ይችላሉ።");
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('loginEmail').value = email;
        }

        function loginUser() {
            let email = document.getElementById('loginEmail').value.trim();
            let pass = document.getElementById('loginPass').value.trim();
            let saved = JSON.parse(localStorage.getItem('bingoUser'));

            if(!saved) {
                alert("ምንም የተመዘገበ አካውንት የለም! እባክዎ መጀመሪያ ይመዝገቡ።");
                return;
            }

            if(saved.email === email && saved.pass === pass) {
                currentUser = saved;
                localStorage.setItem('isLoggedIn', 'true');
                loadGameUI();
            } else {
                alert("የገባጉት ስልክ/ኢሜይል ወይም ሚስጥር ቁጥር ስህተት ነው!");
            }
        }

        function logoutUser() {
            stopAutoPlay();
            localStorage.removeItem('isLoggedIn');
            document.getElementById('gameSection').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }

        function loadGameUI() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = currentUser.name;
            document.getElementById('userBalance').innerText = currentUser.balance;
            
            buildCardsSelectorGrid();
        }

        function buildCardsSelectorGrid() {
            let grid = document.getElementById('cardsListGrid');
            grid.innerHTML = '';
            selectedCards = [];

            for(let i = 1; i <= 100; i++) {
                let btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.innerText = i;
                btn.onclick = () => {
                    toggleCardSelection(i, btn);
                };
                grid.appendChild(btn);
            }
            updateSelectionInfo();
        }

        function toggleCardSelection(cardNum, btnElement) {
            let index = selectedCards.indexOf(cardNum);
            if(index > -1) {
                selectedCards.splice(index, 1);
                btnElement.classList.remove('selected');
            } else {
                selectedCards.push(cardNum);
                btnElement.classList.add('selected');
            }
            updateSelectionInfo();
        }

        function updateSelectionInfo() {
            let count = selectedCards.length;
            let cost = count * 10;
            document.getElementById('selectedCardsInfo').innerText = `የተመረጡ ካርዶች: ${count} (${cost} ብር)`;
        }

        function startSelectedGame() {
            if(selectedCards.length === 0) {
                alert("እባክዎ መጀመሪያ በግራ በኩል ካሉት (1-100) ቁጥሮች ቢያንስ አንድ ካርድ ይምረጡ!");
                return;
            }

            let cost = selectedCards.length * 10; 
            if(currentUser.balance < cost) {
                alert(`በቂ ብር የለዎትም! ለተመረጡት ካርዶች ${cost} ብር ያስፈልጋል።`);
                return;
            }

            currentUser.balance -= cost;
            document.getElementById('userBalance').innerText = currentUser.balance;
            localStorage.setItem('bingoUser', JSON.stringify(currentUser));

            stopAutoPlay();
            availableNumbers = Array.from({length: 75}, (_, i) => i + 1);
            calledNumbers = [];
            generateSelectedCards();
        }

        function generateSelectedCards() {
            let container = document.getElementById('cardsArea');
            container.innerHTML = '';
            cardsData = [];

            selectedCards.forEach(cardNum => {
                let cardGrid = [];
                for(let r = 0; r < 5; r++) {
                    let row = [];
                    for(let col = 0; col < 5; col++) {
                        let randVal = ((cardNum * 31 + r * 13 + col * 7) % 15) + (col * 15) + 1;
                        row.push(col === 2 && r === 2 ? 'FREE' : randVal);
                    }
                    cardGrid.push(row);
                }
                cardsData.push(cardGrid);

                let cardDiv = document.createElement('div');
                cardDiv.className = 'bingo-card';
                cardDiv.innerHTML = `<h3>ካርድ #${cardNum}</h3>`;
                
                let gridDiv = document.createElement('div');
                gridDiv.className = 'bingo-grid';

                ['B','I','N','G','O'].forEach(l => {
                    gridDiv.innerHTML += `<div class="bingo-cell header-cell">${l}</div>`;
                });

                for(let r = 0; r < 5; r++) {
                    for(let col = 0; col < 5; col++) {
                        let val = cardGrid[r][col];
                        let isFree = val === 'FREE';
                        let cell = document.createElement('div');
                        cell.className = `bingo-cell ${isFree ? 'free-space marked' : ''}`;
                        cell.innerText = val;
                        if(!isFree) {
                            cell.onclick = function() {
                                if(calledNumbers.includes(val)) {
                                    this.classList.toggle('marked');
                                } else {
                                    alert("ይህ ቁጥር ገና አልተጠራም!");
                                }
                            };
                        }
                        gridDiv.appendChild(cell);
                    }
                }
                cardDiv.appendChild(gridDiv);
                container.appendChild(cardDiv);
            });
        }

        // ቁጥር መጥሪያ (Manual & Auto)
        function callNextNumber() {
            if(availableNumbers.length === 0) {
                alert("ሁሉም ቁጥሮች አልቀዋል!");
                stopAutoPlay();
                return;
            }
            let idx = Math.floor(Math.random() * availableNumbers.length);
            let num = availableNumbers.splice(idx, 1)[0];
            calledNumbers.push(num);
            let letter = num <= 15 ? 'B' : num <= 30 ? 'I' : num <= 45 ? 'N' : num <= 60 ? 'G' : 'O';
            document.getElementById('currentBall').innerHTML = `<span class="letter">${letter}</span><span class="number">${num}</span>`;
        }

        // አውቶማቲክ ጥሪ መቆጣጠሪያ (Auto Play Toggle)
        function toggleAutoPlay() {
            let btn = document.getElementById('autoPlayBtn');
            if(autoPlayInterval) {
                stopAutoPlay();
            } else {
                if(cardsData.length === 0) {
                    alert("እባክዎ መጀመሪያ ካርዶችን አውጥተው ጨዋታ ይጀምሩ!");
                    return;
                }
                btn.innerText = "⏸ አቁም (Stop)";
                btn.style.backgroundColor = "#ef4444";
                
                // በየ 3 ሰከንዱ አንድ ቁጥር በራሱ ይጠራል
                autoPlayInterval = setInterval(() => {
                    if(availableNumbers.length > 0) {
                        callNextNumber();
                    } else {
                        stopAutoPlay();
                    }
                }, 3000);
            }
        }

        function stopAutoPlay() {
            if(autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
                let btn = document.getElementById('autoPlayBtn');
                if(btn) {
                    btn.innerText = "▶ አውቶ ጀምር (Auto)";
                    btn.style.backgroundColor = "";
                }
            }
        }

        function checkLineWin(cardIndex) {
            let cells = document.querySelectorAll(`#cardsArea .bingo-card:nth-child(${cardIndex + 1}) .bingo-cell`);
            let grid = [];
            let cellElements = Array.from(cells).slice(5);
            
            for(let i = 0; i < 5; i++) {
                grid.push(cellElements.slice(i * 5, (i + 1) * 5));
            }

            for(let r = 0; r < 5; r++) {
                if(grid[r].every(cell => cell.classList.contains('marked'))) return true;
            }

            for(let c = 0; c < 5; c++) {
                let colMarked = true;
                for(let r = 0; r < 5; r++) {
                    if(!grid[r][c].classList.contains('marked')) colMarked = false;
                }
                if(colMarked) return true;
            }

            let diag1 = true, diag2 = true;
            for(let i = 0; i < 5; i++) {
                if(!grid[i][i].classList.contains('marked')) diag1 = false;
                if(!grid[i][4 - i].classList.contains('marked')) diag2 = false;
            }

            return diag1 || diag2;
        }

        function checkCornersWin(cardIndex) {
            let cells = document.querySelectorAll(`#cardsArea .bingo-card:nth-child(${cardIndex + 1}) .bingo-cell`);
            let gameCells = Array.from(cells).slice(5);

            let topLeft = gameCells[0].classList.contains('marked');
            let topRight = gameCells[4].classList.contains('marked');
            let bottomLeft = gameCells[20].classList.contains('marked');
            let bottomRight = gameCells[24].classList.contains('marked');

            return topLeft && topRight && bottomLeft && bottomRight;
        }

        function checkBingo() {
            let pattern = document.getElementById('patternSelect').value;
            let hasWon = false;

            for(let i = 0; i < cardsData.length; i++) {
                if(pattern === 'line' && checkLineWin(i)) {
                    hasWon = true;
                    break;
                } else if(pattern === 'corners' && checkCornersWin(i)) {
                    hasWon = true;
                    break;
                }
            }

            if(hasWon) {
                stopAutoPlay();
                currentUser.balance += 500;
                document.getElementById('userBalance').innerText = currentUser.balance;
                localStorage.setItem('bingoUser', JSON.stringify(currentUser));
                alert("🎉 እንኳን ደስ አለዎት! ህጉን አሟልተው 500 ብር አሸንፈዋል!");
            } else {
                alert("❌ ገና አልአሸነፉም! እባክዎ የጎደሉትን ቁጥሮች ያረጋግጡ።");
            }
        }

        window.onload = function() {
            let isLoggedIn = localStorage.getItem('isLoggedIn');
            let saved = JSON.parse(localStorage.getItem('bingoUser'));
            if(isLoggedIn === 'true' && saved) {
                currentUser = saved;
                loadGameUI();
            }
        };
    </script>
